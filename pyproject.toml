[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metacog-mem"
version = "0.1.0"
description = "Manifold-based metacognitive memory for LLM agents (zero hyperparameters, anti-laundering)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.0.0,<2",   # FastMCP was renamed in mcp 2.x ; the server targets the 1.x API
    "nltk>=3.9.4",
    "fastembed>=0.8.0",  # the production encoder (mnema's multilingual MiniLM, ONNX/CPU)
]

[project.optional-dependencies]
bench = [
    "sentence-transformers>=2.0.0",
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "anthropic>=0.30.0",
]

[project.scripts]
metacog-mcp = "metacog.mcp_server:main"

[tool.setuptools]
packages = ["metacog", "benchmarks", "benchmarks.locomo"]
