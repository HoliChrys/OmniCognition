[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metacog-mem"
version = "0.1.0"
description = "Manifold-based metacognitive memory for LLM agents (zero hyperparameters, anti-laundering)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
metacog-mcp = "metacog.mcp_server:main"

[tool.setuptools]
packages = ["metacog"]
