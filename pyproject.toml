[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metacog-mem"
version = "0.1.0"
description = "Manifold-based metacognitive memory for LLM agents (zero hyperparameters, anti-laundering)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.0.0,<2",   # FastMCP was renamed in mcp 2.x ; the server targets the 1.x API
    "nltk>=3.9.4",
    "fastembed>=0.8.0",  # the production encoder (mnema's multilingual MiniLM, ONNX/CPU)
    "numpy",  # vectorised geometry (geometric_spread) ; already pulled by fastembed
    # PINNED (OO·V1·M2, TAC2-1149) : onnxruntime picks CPU kernels at run time, and the
    # bit-for-bit oracle (`benchmarks/storage_baseline`) and tachikoma's embedder (same
    # model, same version) only agree on one set of wheels.
    "onnxruntime==1.31.1",
]

[project.optional-dependencies]
bench = [
    "sentence-transformers>=2.0.0",
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "anthropic>=0.30.0",
]
# What the CI installs on top of [bench] (TAC-2461) : the test runner, the lint, and
# `networkx` (louvain communities, `metacog/communities.py`, imported lazily).
test = [
    "pytest>=8",
    "networkx>=3",
    "ruff==0.17.4",
]

[project.scripts]
metacog-mcp = "metacog.mcp_server:main"

[tool.setuptools]
packages = ["metacog", "metacog.store", "benchmarks", "benchmarks.locomo"]

# The CI lint (TAC-2461) : syntax errors and undefined names only — the flake8 "stop the
# build" set. The tree is not style-clean (153 E/F findings at 7bf2200), so the wider
# default set would never be green.
[tool.ruff]
extend-exclude = [".paperclip-repositories", ".paperclip-runtime"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
